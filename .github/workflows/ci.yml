name: CI

# KWM-061 — gate every PR on lint, typecheck, tests, and a production build.
# Runs on PRs into the long-lived branches and on direct pushes to them so a
# merge is re-validated. A red job blocks the merge once these checks are made
# required in branch protection (see docs / repo settings).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Only read access is needed; keep the token least-privilege.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs the suite WITH coverage so the thresholds in vitest.config.ts are
      # enforced on every PR — a floor nobody runs is not a ratchet. This is a
      # single run, not `npm test` plus a second coverage pass: the same tests
      # execute either way, so the only cost is instrumentation.
      #
      # `--if-present` is deliberately gone. It was there while no test script
      # existed; keeping it now would let a renamed or deleted script turn this
      # job green while running nothing at all.
      - name: Test (coverage thresholds enforced)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only. utils/db/dbConfig.ts constructs a Neon
          # client at module load (neon(process.env.DATABASE_URL!)); no query
          # runs during `next build`, so a syntactically valid throwaway URL is
          # enough and connects to nothing. These are NOT secrets.
          DATABASE_URL: postgresql://user:password@localhost:5432/db
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret
